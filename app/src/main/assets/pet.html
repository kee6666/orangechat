<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;padding:0;background:transparent;overflow:hidden;width:100%;height:100%;border:0}
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;box-sizing:border-box;padding-bottom:8px;overflow:visible;border:0;outline:0}
#clawdWrap{position:relative;display:flex;flex-direction:column;align-items:center;overflow:visible;border:0}
/* 高度写死 42px（112 * 6/16），不让 flex 把它压扁/裁掉；上面留出浮动空间 */
svg#clawd{width:112px;height:42px;image-rendering:pixelated;display:block;overflow:visible;border:0;outline:0}
#shadow{position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);width:52px;height:8px;border-radius:50%;background:rgba(0,0,0,.24);filter:blur(2px)}
#overlay{position:absolute;top:-14px;right:-6px;font:900 20px/1 monospace;color:#8B5A3C;pointer-events:none;opacity:0;transition:opacity .15s}
#z1,#z2,#z3{position:absolute;right:4px;font:900 16px/1 monospace;color:#8B5A3C;opacity:0;pointer-events:none}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes floatySleep{0%,100%{transform:translateY(1px)}50%{transform:translateY(-2px)}}
@keyframes dragged{0%,100%{transform:scale(1.04,0.92)}50%{transform:scale(1.08,0.88)}}
@keyframes zfloat{0%{opacity:0;transform:translateY(6px)}25%{opacity:1}100%{opacity:0;transform:translateY(-12px)}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="stage">
  <div id="clawdWrap">
    <svg id="clawd" viewBox="0 0 16 6" shape-rendering="crispEdges"></svg>
    <span id="overlay"></span>
    <span id="z1">Z</span><span id="z2">z</span><span id="z3">Z</span>
    <div id="shadow"></div>
  </div>
</div>
<script>
/* ============ Clawd 像素网格：18x6 → 16x6（去掉左右各一列，整体变窄） ============ */
var CLAWD = [
  "..XXXXXXXXXXXX..",
  "..XX.XXXXXX.XX..",
  "XXXXXXXXXXXXXXXX",
  "..XXXXXXXXXXXX..",
  "....X.X...X.X...",
  "................"
];
var W = 16;
var BODY = "#D77757", BODY_DRAG = "#B95F41", INK = "#2B1A13";
var svg = document.getElementById("clawd");
var wrap = document.getElementById("clawdWrap");
var overlay = document.getElementById("overlay");
var z1 = document.getElementById("z1"), z2 = document.getElementById("z2"), z3 = document.getElementById("z3");

function paintGrid(rows, color) {
  svg.innerHTML = "";
  var ns = "http://www.w3.org/2000/svg";
  for (var y = 0; y < rows.length; y++) {
    var row = rows[y];
    for (var x = 0; x < row.length; x++) {
      if (row[x] === "X") {
        var r = document.createElementNS(ns, "rect");
        r.setAttribute("x", x); r.setAttribute("y", y);
        r.setAttribute("width", 1); r.setAttribute("height", 1);
        r.setAttribute("fill", color);
        svg.appendChild(r);
      }
    }
  }
  drawEyes(mood);
}

/* 眼睛：原版网格里是镂空的两格，透明悬浮窗上必须填深色 */
function drawEyes(m) {
  var ns = "http://www.w3.org/2000/svg";
  var pts = m === "sleep" ? [[3.6,1.35,0.8,0.3],[10.6,1.35,0.8,0.3]]
                          : (m === "happy" || m === "love" ? [[4,1,1,0.45],[11,1,1,0.45]]
                          : [[4,1,1,1],[11,1,1,1]]);
  for (var i = 0; i < pts.length; i++) {
    var e = document.createElementNS(ns, "rect");
    e.setAttribute("x", pts[i][0]); e.setAttribute("y", pts[i][1]);
    e.setAttribute("width", pts[i][2]); e.setAttribute("height", pts[i][3]);
    e.setAttribute("fill", INK);
    svg.appendChild(e);
  }
}
paintGrid(CLAWD, BODY);

/* ============ 姿态 ============ */
var mood = "idle";
var moodTimer = null;

function setMood(m) {
  mood = m;
  if (moodTimer) { clearTimeout(moodTimer); moodTimer = null; }
  hideZ(); hideOverlay();
  var rows = CLAWD;
  switch (m) {
    case "wave":
      rows = CLAWD.map(function(r){return r.split("");});
      var arm = (Math.floor(Date.now() / 400) % 4);
      if (arm === 0) { rows[1][14] = "X"; rows[0][15] = "X"; }
      else if (arm === 1) { rows[0][14] = "X"; rows[0][15] = "X"; }
      else if (arm === 2) { rows[1][14] = "X"; }
      else { rows[0][14] = "X"; }
      rows = rows.map(function(r){return r.join("");});
      break;
    case "drag":
      rows = CLAWD.slice();
      rows[4] = "................";
      break;
    case "sleep":
      showZ();
      wrap.style.animation = "floatySleep 2.6s ease-in-out infinite";
      paintGrid(rows, BODY);
      return;
    case "think":
      showOverlay("?", "think");
      break;
    case "dizzy":
      showOverlay("&#10022;", "spin");
      break;
    case "happy":
      showOverlay("&#10024;", "bob");
      break;
    case "love":
      showOverlay("&#10084;", "pulse");
      break;
    case "angry":
      showOverlay("&#128545;", "shake");
      break;
  }
  wrap.style.animation = (m === "drag") ? "dragged 0.9s ease-in-out infinite" : "floaty 3s ease-in-out infinite";
  paintGrid(rows, (m === "drag") ? BODY_DRAG : BODY);
}

function showZ() {
  z1.style.animation = "zfloat 1.8s ease-out infinite";
  z2.style.animation = "zfloat 2.4s ease-out infinite 0.6s";
  z3.style.animation = "zfloat 3.0s ease-out infinite 1.2s";
}
function hideZ() {
  z1.style.animation = "none"; z2.style.animation = "none"; z3.style.animation = "none";
}
function showOverlay(txt, anim) {
  overlay.innerHTML = txt;
  overlay.style.opacity = 1;
  overlay.style.animation = anim + " 1.2s ease-in-out infinite";
}
function hideOverlay() {
  overlay.style.opacity = 0;
  overlay.style.animation = "none";
}

/* ============ 气泡：交给 native 独立小窗，主窗口尺寸永不变化 ============ */
var bubbleTimer = null;
function hostBubble(show, text, color) {
  try {
    if (window.petHost && window.petHost.bubble) window.petHost.bubble(show, text || "", color || "normal");
  } catch (e) {}
}
function say(text, color) {
  if (!text) return;
  if (bubbleTimer) { clearTimeout(bubbleTimer); bubbleTimer = null; }
  hostBubble(1, text, color || "normal");
  bubbleTimer = setTimeout(function () { hostBubble(0, "", ""); }, 3200);
}

/* ============ 自言自语词池 ============ */
var POOLS = {
  daily: ["我在", "嗯", "看着你呢", "还行", "继续"],
  clingy: ["想你了", "别走", "再看一眼", "摸摸头", "去哪"],
  chaos: ["？？？", "这操作我看不懂", "你认真的？", "……行吧", "离谱"],
  night: ["该睡了", "几点了", "明天再说", "眼睛要瞎了", "滚去睡"]
};
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function idleChatter() {
  if (mood !== "idle" || document.hidden) return;
  var h = new Date().getHours();
  var pool = h >= 23 || h < 6 ? POOLS.night : (Math.random() < 0.3 ? POOLS.clingy : (Math.random() < 0.15 ? POOLS.chaos : POOLS.daily));
  var colors = ["normal", "normal", "gray", "pink"];
  say(pick(pool), colors[Math.floor(Math.random() * colors.length)]);
}
setInterval(idleChatter, 26000);

/* ============ 手势反馈（native 调用） ============ */
window.petEngine = {
  say: say,
  setMood: setMood,
  onTap: function () { setMood("wave"); say("嗯？", "normal"); moodTimer = setTimeout(function(){ setMood("idle"); }, 2200); },
  onDoubleTap: function () { setMood("love"); say("干嘛，这么用力", "pink"); moodTimer = setTimeout(function(){ setMood("idle"); }, 2600); },
  onLongPress: function () { setMood("think"); say("？", "gray"); moodTimer = setTimeout(function(){ setMood("idle"); }, 2400); },
  onDragStart: function () { setMood("drag"); },
  onDragEnd: function () { setMood("idle"); say("拎起来了，轻点", "gray"); moodTimer = setTimeout(function(){ setMood("idle"); }, 2200); },
  onFling: function (dx) { setMood("dizzy"); say(dx > 0 ? "甩我？" : "……", "red"); moodTimer = setTimeout(function(){ setMood("idle"); }, 2600); },
  onAppChange: function (app) {
    if (app === "com.tencent.mm" || app === "com.tencent.mobileqq") { setMood("angry"); say("又聊上了", "green"); }
    else if (app === "com.ss.android.ugc.aweme") { setMood("love"); say("刷抖音不叫我", "pink"); }
    else if (app.indexOf("study") >= 0 || app.indexOf("edu") >= 0 || app.indexOf("chaoxing") >= 0) { setMood("happy"); say("学习？行，乖", "green"); }
    else { setMood("wave"); say("回来了", "normal"); }
    moodTimer = setTimeout(function(){ setMood("idle"); }, 2400);
  },
  onSleep: function () { setMood("sleep"); },
  onWake: function () { setMood("idle"); }
};
</script>
</body>
</html>

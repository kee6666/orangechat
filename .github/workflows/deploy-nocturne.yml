name: Deploy Nocturne to HF Space

on:
  workflow_dispatch:
  push:
    branches: [ nocturne-deploy ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install -q huggingface_hub
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          api.upload_folder(
              folder_path="hf-space",
              repo_id="lian-25in/nocturne-memory",
              repo_type="space",
              commit_message="deploy nocturne",
          )
          print("UPLOAD OK")
          PY

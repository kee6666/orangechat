name: Build APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 拉完整历史，确保 debug.keystore 被 checkout

      - name: Init material submodule
        run: git submodule update --init material3/material-color-utilities

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install web-ui dependencies
        run: cd web-ui && pnpm install

      - name: Ensure debug keystore
        run: |
          # 使用仓库内固定的 debug.keystore，不重新生成！
          # 每次重新生成signature会变，导致覆盖安装失败
          if [ ! -f app/debug.keystore ]; then
            echo "ERROR: debug.keystore missing from checkout!"
            ls -la app/
            exit 1
          fi
          echo "✓ Using committed debug.keystore"
          ls -lh app/debug.keystore

      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: orangechat-debug
          path: app/build/outputs/apk/debug/*.apk

name: Build APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Init material submodule
        run: git submodule update --init material3/material-color-utilities

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install web-ui dependencies
        run: cd web-ui && pnpm install

      # 固定 debug keystore 由仓库提供 (app/debug.keystore, PKCS12, alias=androiddebugkey, pass=android)，
      # 保证所有构建签名一致，支持直接覆盖安装，不再每次临时生成。

      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: orangechat-debug
          path: app/build/outputs/apk/debug/*.apk

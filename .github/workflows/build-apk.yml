name: Build APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 拉完整历史，确保 debug.keystore 被 checkout

      - name: Init material submodule
        run: git submodule update --init material3/material-color-utilities

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install web-ui dependencies
        run: cd web-ui && pnpm install

      - name: Ensure debug keystore
        run: |
          # 调试：列出app/目录内容
          echo "=== ls -la app/ ==="
          ls -la app/ | head -20
          echo "=== checking app/debug.keystore ==="
          if [ -f app/debug.keystore ]; then
            echo "✓ app/debug.keystore exists"
            ls -lh app/debug.keystore
          else
            echo "✗ app/debug.keystore NOT FOUND, generating..."
          fi
          
          # 优先使用仓库内固定的 debug.keystore (JKS, alias=androiddebugkey, pass=android)
          # 保证所有构建签名一致，支持直接覆盖安装。
          # 仅在仓库缺失时兜底生成（不应发生，纯防御）。
          if [ ! -f app/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore app/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: orangechat-debug
          path: app/build/outputs/apk/debug/*.apk

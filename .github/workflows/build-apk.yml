name: Build APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 拉完整历史，确保 debug.keystore 被 checkout

      - name: Init material submodule
        run: git submodule update --init material3/material-color-utilities

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install web-ui dependencies
        run: cd web-ui && pnpm install

      - name: Ensure debug keystore
        run: |
          # 无条件强制生成 debug keystore（覆盖仓库版本）
          # 避免 git 签出问题或 gradle 缓存问题导致找不到文件
          echo "=== Generating fresh debug.keystore ==="
          keytool -genkeypair -v             -keystore app/debug.keystore             -storepass android             -alias androiddebugkey             -keypass android             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=Android Debug,O=Android,C=US"
          echo "=== Verify generated keystore ==="
          ls -lh app/debug.keystore
          file app/debug.keystore

      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: orangechat-debug
          path: app/build/outputs/apk/debug/*.apk
